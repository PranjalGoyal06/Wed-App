<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Wedding App</title>
    <link rel="stylesheet" href="/frontend/src/styles/main.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <h1>💒 Wedding App</h1>
            </div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="login.html">Login</a>
            </div>
        </div>
    </nav>

    <section style="padding: 4rem 0; background: #f9f9f9; min-height: calc(100vh - 200px);">
        <div class="container">
            <div class="form-container">
                <h2 style="text-align: center; color: #667eea; margin-bottom: 2rem;">Login</h2>
                <div id="alertMessage"></div>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 1rem;">Login</button>
                </form>
                <p style="text-align: center;">
                    Don't have an account? <a href="register.html" style="color: #667eea;">Register here</a>
                </p>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2024 Wedding App. Made with ❤️ for your special day!</p>
        </div>
    </footer>

    <script src="/frontend/src/utils/api.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const alertDiv = document.getElementById('alertMessage');
            
            try {
                const response = await api.login({ email, password });
                
                if (response.token) {
                    localStorage.setItem('token', response.token);
                    localStorage.setItem('user', JSON.stringify(response.user));
                    
                    alertDiv.innerHTML = '<div class="alert alert-success">Login successful! Redirecting...</div>';
                    
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);
                } else {
                    alertDiv.innerHTML = `<div class="alert alert-error">${response.message || 'Login failed'}</div>`;
                }
            } catch (error) {
                alertDiv.innerHTML = '<div class="alert alert-error">An error occurred. Please try again.</div>';
                console.error('Login error:', error);
            }
        });
    </script>
</body>
</html>
